<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veera Rentals Admin Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            padding: 1rem;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }
        h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 1.6rem;
            color: #111827;
            margin-bottom: 0.5rem;
        }
        p {
            color: #6b7280;
            margin-bottom: 1.25rem;
            font-size: 0.95rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #1f2937;
        }
        input {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 1rem;
            margin-bottom: 1rem;
        }
        input:focus {
            outline: none;
            border-color: #ffd700;
        }
        button {
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: 0.9rem;
            font-weight: 700;
            font-size: 1rem;
            background: #ffd700;
            color: #1a1a1a;
            cursor: pointer;
        }
        button:hover { background: #ffed4e; }
        .error {
            margin-top: 0.8rem;
            color: #dc2626;
            font-size: 0.9rem;
            display: none;
        }
        .note {
            margin-top: 1rem;
            font-size: 0.82rem;
            color: #6b7280;
        }
        .loading {
            display: grid;
            place-items: center;
            min-height: 100vh;
            gap: 1rem;
        }
        .spinner {
            border: 4px solid #e5e7eb;
            border-top-color: #ffd700;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        body.loading { display: flex; }
        body.ready { display: grid; }
    </style>
</head>
<body class="loading">
    <div class="loading" id="loading-state">
        <div class="spinner"></div>
        <p>Loading...</p>
    </div>

    <div class="login-card" id="login-card" style="display: none;">
        <h1>Admin Login</h1>
        <p>Sign in with your admin account to access the dashboard.</p>

        <form id="admin-login-form">
            <label for="admin-email">Email</label>
            <input id="admin-email" type="email" placeholder="admin@example.com" required>
            <label for="admin-password">Password</label>
            <input id="admin-password" type="password" placeholder="Enter password" required>
            <button type="submit">Access Dashboard</button>
            <div id="login-error" class="error">Login failed. Please check credentials.</div>
        </form>

        <p class="note">Admin access is validated from Supabase Auth role claims.</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="../supabase-config.js"></script>
    <script src="shared-utils.js"></script>

    <script>
        const params = new URLSearchParams(window.location.search);
        const nextPath = params.get('next') || 'dashboard.html';
        const errorBox = document.getElementById('login-error');
        const loadingState = document.getElementById('loading-state');
        const loginCard = document.getElementById('login-card');

        function showLoginForm() {
            loadingState.style.display = 'none';
            loginCard.style.display = 'block';
            document.body.classList.remove('loading');
            document.body.classList.add('ready');
        }

        function getClient() {
            if (window.VeeraShared && typeof window.VeeraShared.getSupabaseClient === 'function') {
                return window.VeeraShared.getSupabaseClient();
            }
            return typeof window.getVeeraSupabaseClient === 'function' ? window.getVeeraSupabaseClient() : null;
        }

        function hasAdminRole(user) {
            const appRole = user?.app_metadata?.role;
            const userRole = user?.user_metadata?.role;
            return appRole === 'admin' || userRole === 'admin';
        }

        (async function bootstrap() {
            const client = getClient();
            if (!client) {
                errorBox.textContent = 'Supabase client unavailable. Check configuration.';
                errorBox.style.display = 'block';
                showLoginForm();
                return;
            }

            try {
                const { data, error } = await client.auth.getSession();
                if (!error && data?.session?.user && hasAdminRole(data.session.user)) {
                    // Already logged in, redirect immediately without showing flickering
                    window.location.replace(nextPath);
                    return;
                }
            } catch (e) {
                console.error('Session check error:', e);
            }

            // Not logged in, show login form
            showLoginForm();
        })();

        document.getElementById('admin-login-form').addEventListener('submit', async function (event) {
            event.preventDefault();
            errorBox.style.display = 'none';

            const email = document.getElementById('admin-email').value.trim().toLowerCase();
            const password = document.getElementById('admin-password').value;
            const client = getClient();

            if (!client) {
                errorBox.textContent = 'Supabase client unavailable. Check configuration.';
                errorBox.style.display = 'block';
                return;
            }

            const { data, error } = await client.auth.signInWithPassword({ email, password });
            if (error || !data?.user) {
                errorBox.textContent = 'Login failed. Please check credentials. Error: ' + (error?.message || 'Unknown error');
                errorBox.style.display = 'block';
                console.error('Auth error:', error);
                return;
            }

            if (!hasAdminRole(data.user)) {
                await client.auth.signOut();
                errorBox.textContent = 'Access denied: this user is not an admin. Add role=admin in Supabase app_metadata or user_metadata.';
                errorBox.style.display = 'block';
                return;
            }

            window.location.replace(nextPath);
        });

        window.addEventListener('unhandledrejection', function (event) {
            errorBox.textContent = 'Unexpected error: ' + (event.reason?.message || 'Check console');
            errorBox.style.display = 'block';
            console.error('Unhandled rejection:', event.reason);
            showLoginForm();
        });
    </script>
</body>
</html>
